document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;

    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {

      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);

      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

        s.removeAttribute('src');

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);

card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);\n  padding:26px 26px 28px;transition:transform .18s,box-shadow .18s;display:flex;flex-direction:column;}\n.fail-card:hover{transform:translateY(-3px);box-shadow:0 18px 38px -22px rgba(10,115,116,.4);}\n.fail-num{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--teal);margin-bottom:14px;letter-spacing:.05em;}\n.fail-problem{font-size:18px;font-weight:600;line-height:1.4;color:var(--ink);margin-bottom:16px;}\n.fail-div{height:1px;background:var(--border);margin:0 0 16px;}\n.fail-fixrow{display:flex;gap:11px;align-items:flex-start;}\n.fail-fixrow .fx{flex:none;width:20px;height:20px;border-radius:6px;background:var(--soft2);color:var(--teal);\n  display:grid;place-items:center;margin-top:3px;}\n.fail-fixrow .fx svg{width:13px;height:13px;}\n.fail-fix{font-size:15.5px;line-height:1.5;color:var(--fg2);}\n.fail-fix code{font-family:var(--mono);font-size:13px;color:var(--teal-deep);background:var(--soft2);\n  padding:1px 6px;border-radius:5px;letter-spacing:0;}\n\n/* ───────── Architecture ───────── */\n.layers{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}\n.layer{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:30px 28px;display:flex;flex-direction:column;}\n.layer-top{display:flex;align-items:center;gap:13px;margin-bottom:8px;}\n.layer-ico{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--soft2);color:var(--teal-deep);}\n.layer-ico svg{width:22px;height:22px;}\n.layer-kicker{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--fg3);letter-spacing:.06em;text-transform:uppercase;}\n.layer h3{font-size:23px;font-weight:700;letter-spacing:-.01em;}\n.layer .ldesc{font-size:16px;line-height:1.55;color:var(--fg2);margin:6px 0 22px;text-wrap:pretty;}\n.layer ul{list-style:none;display:flex;flex-direction:column;gap:14px;margin-top:auto;}\n.layer li{display:flex;flex-direction:column;gap:3px;padding-top:14px;border-top:1px solid var(--border);}\n.layer li:first-child{border-top:none;padding-top:0;}\n.layer li .name{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ink);letter-spacing:0;}\n.layer li .role{font-size:14.5px;line-height:1.45;color:var(--fg3);}\n.agent-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;}\n.agent-tags span{font-family:var(--mono);font-size:12.5px;color:var(--teal-deep);background:var(--soft2);\n  padding:5px 10px;border-radius:20px;letter-spacing:0;}\n\n.orch-note{margin-top:30px;background:var(--soft2);border-radius:var(--radius);padding:24px 30px;\n  display:flex;align-items:center;gap:16px;}\n.orch-note .rt{width:30px;height:30px;flex:none;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;}\n.orch-note .rt svg{width:17px;height:17px;}\n.orch-note p{font-size:17px;color:var(--ink);line-height:1.5;}\n.orch-note b{color:var(--teal-deep);}\n\n/* ───────── Install ───────── */\n.install-grid{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:start;}\n.code-card{background:var(--term);border-radius:var(--radius);overflow:hidden;\n  box-shadow:0 24px 50px -26px rgba(10,33,34,.7);}\n.code-card .cc-bar{display:flex;align-items:center;gap:7px;padding:14px 18px;border-bottom:1px solid var(--term-line);}\n.code-card .cc-bar .d{width:11px;height:11px;border-radius:50%;background:#33514f;}\n.code-card .cc-bar .d.t{background:var(--teal);}\n.code-card .cc-bar .label{margin-left:8px;font-family:var(--mono);font-size:12px;color:#6E8F8D;letter-spacing:.04em;}\n.code-card pre{padding:22px 22px 26px;font-family:var(--mono);font-size:14.5px;line-height:1.95;color:#D6ECEA;overflow-x:auto;}\n.code-card .pr{color:var(--teal);}\n.code-card .cm{color:#5E807E;}\n.code-card .fl{color:var(--orange);}\n.code-card .cmd2{color:#fff;}\n.code-card .gn{color:#7FD4A8;}\n\n.col-title{font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--fg3);margin-bottom:16px;}\n.steps{display:flex;flex-direction:column;gap:4px;}\n.step{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--border);}\n.step:last-child{border-bottom:none;}\n.step .sn{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--teal);flex:none;width:26px;}\n.step .stx{font-size:16.5px;line-height:1.5;color:var(--fg2);}\n.step .stx b{color:var(--ink);font-weight:600;}\n.step .stx code{font-family:var(--mono);font-size:13px;color:var(--teal-deep);background:var(--soft2);padding:1px 6px;border-radius:5px;letter-spacing:0;}\n.flags-note{margin-top:14px;font-size:14px;color:var(--fg3);}\n.flags-note code{font-family:var(--mono);color:var(--teal-deep);letter-spacing:0;}\n\n/* ───────── Workflow / loop ───────── */\n.loop{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px;}\n.loop-node{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);\n  padding:22px 20px 24px;display:flex;flex-direction:column;}\n.loop-node::after{content:\"\";position:absolute;right:-11px;top:50%;width:14px;height:14px;\n  border-top:2px solid var(--border);border-right:2px solid var(--border);transform:translateY(-50%) rotate(45deg);z-index:2;background:transparent;}\n.loop-node:last-child::after{display:none;}\n.loop-node .st-no{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--fg3);letter-spacing:.08em;margin-bottom:12px;}\n.loop-node .st-name{font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:.02em;color:var(--teal-deep);margin-bottom:9px;}\n.loop-node .st-desc{font-size:14.5px;line-height:1.5;color:var(--fg2);text-wrap:pretty;}\n.loop-node.red .st-name{color:var(--orange);}\n.loop-node.red{border-color:#F6D2BC;background:linear-gradient(180deg,#FFF6F0,#fff);}\n.loop-node.green .st-name{color:var(--green);}\n.loop-node.green{border-color:#C5E6C6;background:linear-gradient(180deg,#F2FBF2,#fff);}\n.loop-foot{display:flex;flex-wrap:wrap;gap:8px 26px;font-size:15.5px;color:var(--fg2);margin-top:6px;}\n.loop-foot b{color:var(--ink);font-weight:600;}\n.loop-foot code{font-family:var(--mono);font-size:13px;color:var(--teal-deep);background:var(--soft2);padding:1px 6px;border-radius:5px;letter-spacing:0;}\n\n.cmd-block{margin-top:50px;}\n.cmd-block + .cmd-block{margin-top:42px;}\n.cmd-grouptitle{display:flex;align-items:baseline;gap:14px;margin-bottom:22px;flex-wrap:wrap;}\n.cmd-grouptitle .gt{font-size:22px;font-weight:700;letter-spacing:-.01em;color:var(--ink);}\n.cmd-grouptitle .gh{font-size:15px;color:var(--fg3);}\n\n/* lead callout */\n.cmd-lead{margin-top:54px;background:var(--ink);color:#fff;border-radius:var(--radius);\n  padding:30px 36px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;}\n.cmd-lead .big{font-size:25px;font-weight:600;line-height:1.4;letter-spacing:-.01em;flex:1;min-width:300px;text-wrap:pretty;}\nhtml[lang=\"th\"] .cmd-lead .big{font-size:22px;line-height:1.6;letter-spacing:0;}\n.cmd-lead .big b{color:#5FE0DE;font-weight:700;}\n.cmd-lead .chips{display:flex;gap:10px;flex-wrap:wrap;}\n.cmd-lead .chips span{font-family:var(--mono);font-size:14px;font-weight:600;color:#BFE3E2;\n  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);padding:8px 14px;border-radius:30px;letter-spacing:0;}\n.cmd-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}\n.cmd-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 24px 26px;\n  display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s;}\n.cmd-card:hover{transform:translateY(-3px);box-shadow:0 18px 38px -22px rgba(10,115,116,.4);}\n.cmd-card.accent{border-color:#BfE4E4;background:linear-gradient(180deg,var(--soft),#fff);}\n.cmd-card .cname{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--teal-deep);margin-bottom:12px;letter-spacing:0;}\n.cmd-card .cdesc{font-size:15.5px;line-height:1.55;color:var(--fg2);text-wrap:pretty;}\n.cmd-card .cdesc code{font-family:var(--mono);font-size:13px;color:var(--teal-deep);background:var(--soft2);padding:1px 6px;border-radius:5px;letter-spacing:0;}\n.cmd-card .cdesc b{color:var(--ink);font-weight:600;}\n\n/* auto-run group (de-emphasized) */\n.auto-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}\n.auto-card{background:var(--soft);border:1px dashed var(--border);border-radius:var(--radius);padding:22px 22px 24px;display:flex;flex-direction:column;}\n.auto-card .ac-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}\n.auto-card .cname{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--fg2);letter-spacing:0;}\n.auto-badge{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--teal-deep);\n  background:var(--soft2);border:1px solid #C9E6E6;padding:3px 8px;border-radius:20px;}\n.auto-card .cdesc{font-size:14.5px;line-height:1.5;color:var(--fg3);text-wrap:pretty;}\n.auto-card .cdesc code{font-family:var(--mono);font-size:12.5px;color:var(--teal-deep);background:var(--soft2);padding:1px 6px;border-radius:5px;letter-spacing:0;}\n\n/* compact install band */\n.install-band{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;}\n.install-band .ib-cmd{display:flex;align-items:center;gap:14px;background:var(--term);border-radius:var(--radius-sm);\n  padding:18px 20px;font-family:var(--mono);font-size:17px;color:#EAF6F5;box-shadow:0 16px 38px -18px rgba(10,115,116,.5);margin:18px 0 14px;}\n.install-band .ib-cmd .prompt{color:var(--teal);font-weight:700;}\n.install-band .ib-cmd code{flex:1;letter-spacing:.2px;}\n.install-band .ib-cmd .copy{border:none;background:rgba(255,255,255,.08);color:#BFE3E2;font-family:var(--mono);\n  font-size:12px;font-weight:600;padding:7px 12px;border-radius:7px;cursor:pointer;transition:all .15s;letter-spacing:.05em;}\n.install-band .ib-cmd .copy:hover{background:var(--teal);color:#fff;}\n.ib-note{font-size:15px;color:var(--fg3);}\n.ib-flags{display:flex;flex-direction:column;gap:14px;}\n.ib-flag{display:flex;gap:14px;align-items:baseline;}\n.ib-flag .fk{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--teal-deep);background:var(--soft2);\n  padding:4px 10px;border-radius:7px;flex:none;letter-spacing:0;}\n.ib-flag .fv{font-size:15px;color:var(--fg2);line-height:1.45;}\n\n/* ───────── Footer ───────── */\nfooter{background:var(--ink);color:#C8D4D2;padding:70px 0 44px;}\n.foot-top{display:flex;justify-content:space-between;align-items:flex-start;gap:40px;flex-wrap:wrap;\n  padding-bottom:40px;border-bottom:1px solid rgba(255,255,255,.1);}\n.foot-tag{font-size:27px;font-weight:500;color:#fff;letter-spacing:-.01em;max-width:16ch;line-height:1.35;text-wrap:balance;}\nhtml[lang=\"th\"] .foot-tag{font-size:24px;line-height:1.55;letter-spacing:0;max-width:24ch;}\n.foot-tag .q{color:var(--teal);}\n.foot-links{display:flex;gap:56px;}\n.foot-col h4{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin-bottom:16px;}\n.foot-col a,.foot-col span{display:block;font-size:16px;color:#AFC0BE;margin-bottom:11px;transition:color .15s;}\n.foot-col a:hover{color:#fff;}\n.foot-col .mono{font-family:var(--mono);font-size:14px;letter-spacing:0;}\n.foot-bottom{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-top:30px;flex-wrap:wrap;}\n.foot-bottom p{font-size:14px;color:#7C8D8B;}\n.foot-bottom .reqs{font-family:var(--mono);font-size:13px;color:#7C8D8B;letter-spacing:0;}\n\n/* reveal */\n.reveal{opacity:0;transform:translateY(20px);transition:opacity .7s ease,transform .7s ease;}\n.reveal.in{opacity:1;transform:none;}\n@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none;}}\n\n/* responsive */\n@media (max-width:980px){\n  .hero-grid{grid-template-columns:1fr;gap:44px;}\n  .hero h1{font-size:50px;}\n  .layers,.fail-grid{grid-template-columns:1fr;}\n  .install-grid{grid-template-columns:1fr;}\n  .principle .wrap{grid-template-columns:1fr;gap:20px;}\n  .nav-links{display:none;}\n  .loop{grid-template-columns:1fr 1fr;}\n  .loop-node::after{display:none;}\n  .cmd-grid{grid-template-columns:1fr 1fr;}\n  .auto-grid{grid-template-columns:1fr 1fr;}\n  .install-band{grid-template-columns:1fr;gap:32px;}\n}\n@media (max-width:560px){\n  .wrap{padding:0 22px;}\n  .hero h1{font-size:38px;}html[lang=\"th\"] .hero h1{font-size:34px;}\n  .sec-head h2{font-size:32px;}\n  .foot-links{gap:34px;}\n  .loop,.cmd-grid{grid-template-columns:1fr;}\n  .auto-grid{grid-template-columns:1fr;}\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n\n<!-- ───────── NAV ───────── -->\n<header class=\"nav\">\n  <div class=\"wrap nav-inner\">\n    <div class=\"brand\"><span>an<span class=\"dot\">punkit<\u002Fspan><\u002Fspan><span class=\"ver\">v2.0.2<\u002Fspan><\u002Fdiv>\n    <nav class=\"nav-links\">\n      <a href=\"#problem\" data-en=\"Problem\" data-th=\"ปัญหา\">Problem<\u002Fa>\n      <a href=\"#architecture\" data-en=\"Architecture\" data-th=\"สถาปัตยกรรม\">Architecture<\u002Fa>\n      <a href=\"#workflow\" data-en=\"Workflow\" data-th=\"วงจรการทำงาน\">Workflow<\u002Fa>\n      <a href=\"#install\" data-en=\"Install\" data-th=\"ติดตั้ง\">Install<\u002Fa>\n    <\u002Fnav>\n    <div class=\"nav-right\">\n      <div class=\"lang-toggle\" role=\"group\" aria-label=\"Language\">\n        <button data-lang=\"en\" class=\"active\">EN<\u002Fbutton>\n        <button data-lang=\"th\">ไทย<\u002Fbutton>\n      <\u002Fdiv>\n      <a class=\"gh-btn\" href=\"https://github.com/MetheeS/anpunkit\" target=\"_blank\" rel=\"noopener\">\n        <svg viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M12 2C6.48 2 2 6.58 2 12.25c0 4.53 2.87 8.37 6.84 9.73.5.1.68-.22.68-.49v-1.7c-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.62.07-.62 1 .07 1.53 1.06 1.53 1.06.9 1.57 2.34 1.12 2.91.86.09-.66.35-1.12.63-1.38-2.22-.26-4.55-1.14-4.55-5.05 0-1.12.39-2.03 1.03-2.74-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05A9.3 9.3 0 0112 6.84c.85 0 1.71.12 2.51.34 1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.71 1.03 1.62 1.03 2.74 0 3.92-2.34 4.78-4.57 5.04.36.32.68.94.68 1.9v2.82c0 .27.18.6.69.49A10.26 10.26 0 0022 12.25C22 6.58 17.52 2 12 2z\"><\u002Fpath><\u002Fsvg>\n        <span>GitHub<\u002Fspan>\n      <\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ───────── HERO ───────── -->\n<section class=\"hero\">\n  <div class=\"wrap hero-grid\">\n    <div class=\"hero-left\">\n      <span class=\"eyebrow\" data-en=\"Engineering methodology kit\" data-th=\"ชุดเครื่องมือระเบียบวิธีทางวิศวกรรม\">ชุดเครื่องมือพัฒนาซอฟต์แวร์ร่วมกับเอไอ<\u002Fspan>\n      <h1 data-en=\"Deterministic guardrails for &lt;span class='accent'&gt;AI coding agents&lt;/span&gt;.\" data-th=\"ตัวกั้นเชิงกำหนดแน่นอน สำหรับ &lt;span class='accent'&gt;AI coding agents&lt;/span&gt;\">รูปแบบการทำงานที่แน่นอน สำหรับ AI coding agents<\u002Fh1>\n      <p class=\"sub\" data-en=\"anpunkit turns a 10-point manual practice into architecture. The steps that must happen live in hooks — so they can't be skipped, forgotten, or reasoned around.\" data-th=\"anpunkit เปลี่ยนแนวปฏิบัติด้วยมือ 10 ข้อ ให้กลายเป็นสถาปัตยกรรม ขั้นตอนที่ต้องเกิดขึ้นถูกฝังอยู่ใน hooks จึงไม่ถูกข้าม ลืม หรือหาเหตุผลมาเลี่ยงได้\">anpunkit เปลี่ยนแนวปฏิบัติทั้ง 10 ข้อ ให้กลายเป็นสถาปัตยกรรม โดยขั้นตอนที่สำคัญจะถูกฝังอยู่ใน hooks จึงไม่ถูกข้าม ลืม หรือหาเหตุผลมาเลี่ยงได้<\u002Fp>\n\n      <div class=\"install\">\n        <div class=\"install-label\" data-en=\"Install in any project\" data-th=\"ติดตั้งในโปรเจกต์ใดก็ได้\">Install in any project<\u002Fdiv>\n        <div class=\"cmd\">\n          <span class=\"prompt\">$<\u002Fspan>\n          <code id=\"install-cmd\">npx create-anpunkit<\u002Fcode>\n          <button class=\"copy\" id=\"copyBtn\" data-en=\"COPY\" data-th=\"คัดลอก\">COPY<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"install-note\" data-en=\"Non-destructive — it never clobbers your files. Requires Node ≥ 18.\" data-th=\"ไม่ทำลายไฟล์เดิม ไม่เขียนทับไฟล์ของคุณ ต้องใช้ Node ≥ 18\">Non-destructive — it never clobbers your files. Requires Node ≥ 18.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"hero-cta\">\n        <a class=\"btn btn-primary\" href=\"#architecture\" data-en=\"Read the architecture\" data-th=\"อ่านสถาปัตยกรรม\">Read the architecture<\u002Fa>\n        <a class=\"btn btn-ghost\" href=\"#install\" data-en=\"Quickstart\" data-th=\"เริ่มต้นใช้งาน\">Quickstart<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"hero-panel\">\n      <div class=\"grid-lines\"><\u002Fdiv>\n      <div class=\"term-card\">\n        <div class=\"term-bar\"><span class=\"d t\"><\u002Fspan><span class=\"d\"><\u002Fspan><span class=\"d\"><\u002Fspan><span class=\"label\">session-start.sh<\u002Fspan><\u002Fdiv>\n        <div class=\"term-body\">\n<span class=\"pr\">●<\u002Fspan> <span class=\"ev\">new session<\u002Fspan><br>\n<span class=\"ar\">→<\u002Fspan> injecting STATE.md<br>\n<span class=\"ar\">→<\u002Fspan> 2 open issues <span class=\"cm\">// ISSUES.md<\u002Fspan><br>\n<span class=\"ar\">→<\u002Fspan> research INDEX + git state<br>\n<span class=\"ar\">→<\u002Fspan> <span class=\"or\">11 hard rules<\u002Fspan> loaded<br>\n<span class=\"ok\">✓<\u002Fspan> context restored — <span class=\"cm\">no re-orientation<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ───────── PRINCIPLE ───────── -->\n<div class=\"principle\">\n  <div class=\"wrap\">\n    <div class=\"ptag\" data-en=\"The principle\" data-th=\"หลักการ\" style=\"font-size: 40px\">The principle<\u002Fdiv>\n    <blockquote data-en=\"Mandatory steps live in &lt;b&gt;hooks&lt;/b&gt;. Discretionary steps live in &lt;b&gt;agents&lt;/b&gt; and &lt;b&gt;skills&lt;/b&gt;. Hooks are deterministic — they cannot be skipped, forgotten, or reasoned around.\" data-th=\"ขั้นตอนบังคับอยู่ใน &lt;b&gt;hooks&lt;/b&gt; ขั้นตอนที่ใช้ดุลพินิจอยู่ใน &lt;b&gt;agents&lt;/b&gt; และ &lt;b&gt;skills&lt;/b&gt; hooks เป็นแบบกำหนดแน่นอน จึงไม่ถูกข้าม ลืม หรือหาเหตุผลมาเลี่ยงได้\">ขั้นตอนสำคัญอยู่ใน hooks ขั้นตอนที่ใช้ดุลพินิจอยู่ใน agents และ skills\nhooks เป็นแบบกำหนดชัดเจน จึงไม่ถูกข้าม ลืม หรือหาเหตุผลมาเลี่ยงได้<\u002Fblockquote>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- ───────── PROBLEM ───────── -->\n<section class=\"block\" id=\"problem\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <span class=\"eyebrow\" data-en=\"The problem\" data-th=\"ปัญหา\">The problem<\u002Fspan>\n      <h2 data-en=\"Six recurring failures. Six structural fixes.\" data-th=\"ความล้มเหลวซ้ำซาก 6 แบบ การแก้เชิงโครงสร้าง 6 ข้อ\">จากปัญหาซ้ำซากทั้ง 6 แบบ การแก้เชิงโครงสร้าง 6 ข้อ<\u002Fh2>\n      <p data-en=\"A disciplined 10-point manual practice still produced six predictable failures whenever an AI agent was involved. The root cause wasn't the model's capability — it was architecture. Every “must happen” step was buried inside a prompt, so the model could skip it, forget it, or reason its way around it.\" data-th=\"แนวปฏิบัติด้วยมือ 10 ข้อที่มีวินัย ก็ยังเกิดความล้มเหลวที่คาดเดาได้ 6 แบบ ทุกครั้งที่มี AI agent เข้ามาเกี่ยวข้อง ต้นเหตุไม่ใช่ความสามารถของโมเดล แต่เป็นเรื่องสถาปัตยกรรม ทุกขั้นตอนที่ “ต้องเกิดขึ้น” ถูกฝังอยู่ในพรอมป์ต โมเดลจึงข้าม ลืม หรือหาเหตุผลเลี่ยงมันได้\">แม้จะใช้แนวปฏิบัติทั้ง 10 ข้ออย่างมีวินัย ก็ยังเกิดความผิดพลาดที่คาดเดาได้ถึง 6 แบบ ทุกครั้งที่มี AI agent เข้ามาเกี่ยวข้อง ต้นเหตุไม่ใช่ความสามารถของโมเดล แต่เป็นเรื่องสถาปัตยกรรม ทุกขั้นตอนที่ “ต้องเกิดขึ้น” ถูกฝังอยู่ในพรอมต์ โมเดลจึงข้าม ลืม หรือหาเหตุผลเลี่ยงมันได้<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"fail-grid\">\n      <div class=\"fail-card reveal\">\n        <div class=\"fail-num\">01<\u002Fdiv>\n        <div class=\"fail-problem\" data-en=\"Issue log missed — agents repeated known dead ends.\" data-th=\"พลาดบันทึกปัญหา — agent วนทำทางตันที่เคยเจอซ้ำ\">พลาดบันทึกปัญหา — agent วนกับทางตันที่เคยเจอซ้ำไปมา<\u002Fdiv>\n        <div class=\"fail-div\"><\u002Fdiv>\n        <div class=\"fail-fixrow\"><span class=\"fx\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <div class=\"fail-fix\" data-en=\"The &lt;code&gt;session-start.sh&lt;/code&gt; hook injects open ISSUES.md every session, unconditionally.\" data-th=\"hook &lt;code&gt;session-start.sh&lt;/code&gt; จะแทรก ISSUES.md ที่ยังเปิดอยู่ทุกเซสชัน โดยไม่มีเงื่อนไข\">The <code>session-start.sh<\u002Fcode> hook injects open ISSUES.md every session, unconditionally.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"fail-card reveal\">\n        <div class=\"fail-num\">02<\u002Fdiv>\n        <div class=\"fail-problem\" data-en=\"Manual re-orientation every session wasted time.\" data-th=\"ต้องทำความเข้าใจสถานะใหม่ทุกเซสชัน เสียเวลา\">ต้องทำความเข้าใจสถานะใหม่ทุกเซสชัน เสียเวลามมากมาย<\u002Fdiv>\n        <div class=\"fail-div\"><\u002Fdiv>\n        <div class=\"fail-fixrow\"><span class=\"fx\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <div class=\"fail-fix\" data-en=\"The same hook injects STATE.md, git state, and the research INDEX automatically.\" data-th=\"hook เดียวกันนี้แทรก STATE.md สถานะ git และ research INDEX ให้อัตโนมัติ\">The same hook injects STATE.md, git state, and the research INDEX automatically.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"fail-card reveal\">\n        <div class=\"fail-num\">03<\u002Fdiv>\n        <div class=\"fail-problem\" data-en=\"Agents over-struggled on bugs — no circuit breaker.\" data-th=\"agent ดิ้นรนกับบั๊กเกินไป — ไม่มีตัวตัดวงจร\">agent ดิ้นรนแก้บั๊กไม่รู้จบ — ไม่มีใครหยุดให้ถอยมาวิเคราะห์<\u002Fdiv>\n        <div class=\"fail-div\"><\u002Fdiv>\n        <div class=\"fail-fixrow\"><span class=\"fx\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <div class=\"fail-fix\" data-en=\"A hard cap at 3 attempts: warn at 2, STOP at 3, and hand control back to you.\" data-th=\"จำกัดที่ 3 ครั้ง: เตือนเมื่อครั้งที่ 2 หยุดเมื่อครั้งที่ 3 แล้วคืนการควบคุมให้คุณ\">A hard cap at 3 attempts: warn at 2, STOP at 3, and hand control back to you.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"fail-card reveal\">\n        <div class=\"fail-num\">04<\u002Fdiv>\n        <div class=\"fail-problem\" data-en=\"Context rot — debug noise filled the orchestrator window.\" data-th=\"คอนเท็กซ์เน่า — เสียงรบกวนจากการดีบักเต็มหน้าต่าง orchestrator\">Context rot — debug noise filled the orchestrator window.<\u002Fdiv>\n        <div class=\"fail-div\"><\u002Fdiv>\n        <div class=\"fail-fixrow\"><span class=\"fx\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <div class=\"fail-fix\" data-en=\"The debugger runs in an isolated context, writes noise to a file, and returns a terse summary only.\" data-th=\"debugger ทำงานในคอนเท็กซ์แยก เขียนเสียงรบกวนลงไฟล์ แล้วส่งกลับเฉพาะสรุปสั้น ๆ\">debugger ทำงานในคอนเท็กซ์แยก เขียนรายละเอียดลงไฟล์ แล้วส่งกลับเฉพาะสรุปสั้น ๆ<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"fail-card reveal\">\n        <div class=\"fail-num\">05<\u002Fdiv>\n        <div class=\"fail-problem\" data-en=\"No subagent orchestration — everything ran inline.\" data-th=\"ไม่มีการจัดวง subagent — ทุกอย่างรันรวมกันในที่เดียว\">ไม่มีการจัดวง subagent — ทุกอย่างทำงานรวมกันในที่เดียว<\u002Fdiv>\n        <div class=\"fail-div\"><\u002Fdiv>\n        <div class=\"fail-fixrow\"><span class=\"fx\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <div class=\"fail-fix\" data-en=\"8 scoped subagents; the orchestrator routes between them and never implements or debugs.\" data-th=\"subagent เฉพาะทาง 8 ตัว; orchestrator ทำหน้าที่ส่งต่องาน ไม่เขียนโค้ดหรือดีบักเอง\">8 scoped subagents; the orchestrator routes between them and never implements or debugs.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"fail-card reveal\">\n        <div class=\"fail-num\">06<\u002Fdiv>\n        <div class=\"fail-problem\" data-en=\"Handoff files grew unbounded — STATE.md bloat.\" data-th=\"ไฟล์ส่งต่องานบวมไม่หยุด — STATE.md อ้วนขึ้นเรื่อย ๆ\">Handoff files grew unbounded — STATE.md bloat.<\u002Fdiv>\n        <div class=\"fail-div\"><\u002Fdiv>\n        <div class=\"fail-fixrow\"><span class=\"fx\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n        <div class=\"fail-fix\" data-en=\"The synthesizer plus the &lt;code&gt;pre-compact.sh&lt;/code&gt; hook compress and dedup on every compaction.\" data-th=\"synthesizer ร่วมกับ hook &lt;code&gt;pre-compact.sh&lt;/code&gt; บีบอัดและตัดข้อมูลซ้ำทุกครั้งที่บีบคอนเท็กซ์\">The synthesizer plus the <code>pre-compact.sh<\u002Fcode> hook compress and dedup on every compaction.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ───────── ARCHITECTURE ───────── -->\n<section class=\"block tint\" id=\"architecture\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <span class=\"eyebrow\" data-en=\"Architecture\" data-th=\"สถาปัตยกรรม\">Architecture<\u002Fspan>\n      <h2 data-en=\"Three fixed layers.\" data-th=\"สามชั้นที่กำหนดตายตัว\">การทำงานสามประสานที่ออกแบบไว้แล้ว<\u002Fh2>\n      <p data-en=\"The kit is organized around three layers: deterministic hooks, orchestrator-mediated subagents, and declarative documents. The orchestrator reads and routes — it never writes code, runs tests, or debugs.\" data-th=\"ชุดเครื่องมือนี้จัดวางรอบสามชั้น: hooks แบบกำหนดแน่นอน, subagents ที่ orchestrator เป็นตัวกลาง, และเอกสารแบบประกาศ orchestrator อ่านและส่งต่องาน ไม่เขียนโค้ด รันเทสต์ หรือดีบักเอง\">ชุดเครื่องมือนี้จัดวางกรอบไว้สามส่วน: hooks ที่ทำงานแน่นอน, subagents ที่ orchestrator เป็นตัวกลาง, และเอกสารมาตรฐานที่ orchestrator อ่านและส่งต่องาน ไม่เขียนโค้ด รันเทสต์ หรือดีบักเอง<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"layers\">\n      <!-- Hooks -->\n      <div class=\"layer reveal\">\n        <div class=\"layer-top\">\n          <div class=\"layer-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13 3v10a4 4 0 11-4-4h9\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <div>\n            <div class=\"layer-kicker\" data-en=\"Deterministic\" data-th=\"กำหนดแน่นอน\">Deterministic<\u002Fdiv>\n            <h3>Hooks<\u002Fh3>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"ldesc\" data-en=\"Fire automatically at lifecycle points. They cannot be skipped, forgotten, or argued with.\" data-th=\"ทำงานอัตโนมัติตามจุดในวงจรชีวิต ไม่สามารถถูกข้าม ลืม หรือต่อรองได้\">ทำงานอัตโนมัติตามจุดที่ตั้งไว้ ไม่สามารถถูกข้าม ลืม หรือต่อรองได้<\u002Fp>\n        <ul>\n          <li><span class=\"name\">session-start.sh<\u002Fspan><span class=\"role\" data-en=\"Injects git state, STATE.md, open issues &amp; research INDEX on every start.\" data-th=\"แทรกสถานะ git, STATE.md, ปัญหาที่เปิดอยู่ และ research INDEX ทุกครั้งที่เริ่ม\">Injects git state, STATE.md, open issues &amp; research INDEX on every start.<\u002Fspan><\u002Fli>\n          <li><span class=\"name\">pre-compact.sh<\u002Fspan><span class=\"role\" data-en=\"Snapshots STATE.md + git diff before any context loss.\" data-th=\"บันทึกสแนปช็อต STATE.md + git diff ก่อนสูญเสียคอนเท็กซ์\">Snapshots STATE.md + git diff before any context loss.<\u002Fspan><\u002Fli>\n          <li><span class=\"name\">subagent-stop.sh<\u002Fspan><span class=\"role\" data-en=\"A lightweight trace line per subagent finish — audit without bloat.\" data-th=\"บันทึกร่องรอยสั้น ๆ เมื่อ subagent จบงาน ตรวจสอบได้โดยไม่บวม\">A lightweight trace line per subagent finish — audit without bloat.<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <!-- Subagents -->\n      <div class=\"layer reveal\">\n        <div class=\"layer-top\">\n          <div class=\"layer-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"7\" r=\"3\"><\u002Fcircle><circle cx=\"5\" cy=\"17\" r=\"2.5\"><\u002Fcircle><circle cx=\"19\" cy=\"17\" r=\"2.5\"><\u002Fcircle><path d=\"M12 10v3m0 0l-5 2m5-2l5 2\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <div>\n            <div class=\"layer-kicker\" data-en=\"Scoped workers\" data-th=\"ผู้ทำงานเฉพาะทาง\">Scoped workers<\u002Fdiv>\n            <h3>Subagents<\u002Fh3>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"ldesc\" data-en=\"Eight scoped workers. The orchestrator routes between them; each runs in its own context.\" data-th=\"ผู้ทำงานเฉพาะทาง 8 ตัว orchestrator ส่งต่องานระหว่างกัน แต่ละตัวรันในคอนเท็กซ์ของตัวเอง\">ผู้ทำงานเฉพาะทาง 8 ตัว orchestrator ส่งต่องานระหว่างกัน แต่ละตัวรันในบริบทของตัวเอง<\u002Fp>\n        <div class=\"agent-tags\">\n          <span>researcher<\u002Fspan><span>planner<\u002Fspan><span>infra-provisioner<\u002Fspan><span>implementer<\u002Fspan><span>test-author<\u002Fspan><span>debugger<\u002Fspan><span>e2e-runner<\u002Fspan><span>synthesizer<\u002Fspan>\n        <\u002Fdiv>\n        <ul style=\"margin-top:22px;\">\n          <li><span class=\"name\">test-author<\u002Fspan><span class=\"role\" data-en=\"Writes tests blind — never reads the implementation, so the suite can't be biased.\" data-th=\"เขียนเทสต์แบบปิดตา ไม่อ่านโค้ดจริง ชุดทดสอบจึงไม่ลำเอียง\">Writes tests blind — never reads the implementation, so the suite can't be biased.<\u002Fspan><\u002Fli>\n          <li><span class=\"name\">debugger<\u002Fspan><span class=\"role\" data-en=\"Isolated context, hard 3-attempt cap, returns a terse summary.\" data-th=\"คอนเท็กซ์แยก จำกัด 3 ครั้ง ส่งกลับเฉพาะสรุปสั้น ๆ\">คอนเท็กซ์แยก จำกัด 3 ครั้ง ส่งกลับเฉพาะสรุปผลสั้น ๆเท่านั้น<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n\n      <!-- Documents -->\n      <div class=\"layer reveal\">\n        <div class=\"layer-top\">\n          <div class=\"layer-ico\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z\"><\u002Fpath><path d=\"M14 3v5h5M9 13h6M9 17h6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <div>\n            <div class=\"layer-kicker\" data-en=\"State layer\" data-th=\"ชั้นสถานะ\">State layer<\u002Fdiv>\n            <h3>Documents<\u002Fh3>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <p class=\"ldesc\" data-en=\"A declarative state layer. Every rule lives in exactly one place — duplication is a defect.\" data-th=\"ชั้นสถานะแบบประกาศ ทุกกฎอยู่ในที่เดียวเท่านั้น การซ้ำคือข้อบกพร่อง\">ชั้นสถานะแบบมาตรฐาน ทุกกฎอยู่ในที่เดียวเท่านั้น การซ้ำคือข้อบกพร่อง<\u002Fp>\n        <ul>\n          <li><span class=\"name\">AGENTS.md<\u002Fspan><span class=\"role\" data-en=\"Single source of truth — all methodology, roles &amp; hard rules. Tool-agnostic.\" data-th=\"แหล่งความจริงเดียว — ระเบียบวิธี บทบาท และกฎทั้งหมด ไม่ผูกกับเครื่องมือใด\">Single source of truth — all methodology, roles &amp; hard rules. Tool-agnostic.<\u002Fspan><\u002Fli>\n          <li><span class=\"name\">STATE.md<\u002Fspan><span class=\"role\" data-en=\"Current position. Rewritten, not appended. Small by design.\" data-th=\"ตำแหน่งปัจจุบัน เขียนทับใหม่ ไม่ต่อท้าย เล็กโดยตั้งใจ\">Current position. Rewritten, not appended. Small by design.<\u002Fspan><\u002Fli>\n          <li><span class=\"name\">ISSUES.md · ENDPOINTS.md<\u002Fspan><span class=\"role\" data-en=\"The deduped error log and the API catalogue with a hard coverage gate.\" data-th=\"บันทึกข้อผิดพลาดที่ตัดซ้ำแล้ว และแคตาล็อก API พร้อมประตูตรวจความครอบคลุม\">บันทึกข้อผิดพลาดที่ตัดซ้ำแล้ว และแคตาล็อก API พร้อมช่องทางเชื่อมค่อทั้งหมด<\u002Fspan><\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"orch-note reveal\">\n      <span class=\"rt\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12h12m0 0l-4-4m4 4l-4 4\"><\u002Fpath><path d=\"M20 5v14\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n      <p data-en=\"&lt;b&gt;The orchestrator routes only.&lt;/b&gt; The main session never implements or debugs, and subagents can never address the user directly.\" data-th=\"&lt;b&gt;orchestrator ทำหน้าที่ส่งต่องานเท่านั้น&lt;/b&gt; เซสชันหลักไม่เขียนโค้ดหรือดีบัก และ subagent ไม่สามารถพูดกับผู้ใช้ได้โดยตรง\">The orchestrator routes only. The main session never implements or debugs, and subagents can never address the user directly.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ───────── INSTALL ───────── -->\n<section class=\"block\" id=\"workflow\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <span class=\"eyebrow\" data-en=\"Workflow\" data-th=\"วงจรการทำงาน\">Workflow<\u002Fspan>\n      <h2 data-en=\"One phase at a time, tests before logic.\" data-th=\"ทำทีละเฟส เขียนเทสต์ก่อนตรรกะ\">One phase at a time, tests before logic.<\u002Fh2>\n      <p data-en=\"You build the project as a sequence of vertical-slice phases. A phase that adds a public callable surface runs the test-first loop below; pure infra or doc phases run RESEARCH → IMPLEMENT → CLOSE instead. Either way, the regression guard and the ENDPOINTS coverage gate run at CLOSE.\" data-th=\"คุณสร้างโปรเจกต์เป็นลำดับเฟสแบบ vertical-slice เฟสที่เพิ่มพื้นผิวที่เรียกใช้ได้แบบสาธารณะจะวิ่งตามลูปเขียนเทสต์ก่อนด้านล่าง ส่วนเฟส infra หรือเอกสารล้วน ๆ จะวิ่ง RESEARCH → IMPLEMENT → CLOSE แทน ไม่ว่าทางใด ตัวคุมถดถอยและประตูตรวจความครอบคลุม ENDPOINTS จะทำงานตอน CLOSE\">คุณสร้างโปรเจกต์ด้วยการตัดเฟสแบบ vertical-slice เฟสที่เพิ่มการใช้งานที่เรียกใช้ได้แบบสาธารณะจะวิ่งตามลูปโดยเขียนการทดสอบก่อน ส่วนเฟส infra หรือเฟสเอกสารล้วน ๆ จะวิ่ง RESEARCH → IMPLEMENT → CLOSE แทน แต่ไม่ว่าทางใด การตรวจสอบอย่างเข้มข้นและประตูตรวจสอบการเชื่อมต่อ จะทำงานตอนปิดเฟสเสมอ<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"loop reveal\">\n      <div class=\"loop-node\"><div class=\"st-no\">STEP 1<\u002Fdiv><div class=\"st-name\">RESEARCH<\u002Fdiv><div class=\"st-desc\" data-en=\"The researcher checks the shared KB first, investigates the codebase &amp; services, and returns a terse summary.\" data-th=\"researcher ตรวจ KB ที่แชร์ก่อน สำรวจโค้ดเบสและบริการ แล้วส่งกลับสรุปสั้น ๆ\">The researcher checks the shared KB first, investigates the codebase &amp; services, and returns a terse summary.<\u002Fdiv><\u002Fdiv>\n      <div class=\"loop-node\"><div class=\"st-no\">STEP 2<\u002Fdiv><div class=\"st-name\">SCAFFOLD<\u002Fdiv><div class=\"st-desc\" data-en=\"The implementer writes interface stubs only — no logic. There is nothing to peek at.\" data-th=\"implementer เขียนแค่โครงอินเทอร์เฟซ ไม่มีตรรกะ จึงไม่มีอะไรให้แอบดู\">implementer เขียนแค่โครงอินเทอร์เฟซ ไม่มีตรรกะ จึงไม่มีอะไรให้การเขียน testcase แอบดูได้<\u002Fdiv><\u002Fdiv>\n      <div class=\"loop-node red\"><div class=\"st-no\">STEP 3<\u002Fdiv><div class=\"st-name\">RED<\u002Fdiv><div class=\"st-desc\" data-en=\"The test-author writes the suite blind against the stubs. Every test must collect and FAIL. Green-on-stubs is rejected.\" data-th=\"test-author เขียนชุดทดสอบแบบปิดตากับโครงนั้น ทุกเทสต์ต้องรันได้และ FAIL ถ้าผ่านทั้งที่ยังเป็นโครงจะถูกปฏิเสธ\">The test-author writes the suite blind against the stubs. Every test must collect and FAIL. Green-on-stubs is rejected.<\u002Fdiv><\u002Fdiv>\n      <div class=\"loop-node green\"><div class=\"st-no\">STEP 4<\u002Fdiv><div class=\"st-name\">GREEN<\u002Fdiv><div class=\"st-desc\" data-en=\"The implementer fills the logic until the real API suite passes — and only that closes the gate.\" data-th=\"implementer เติมตรรกะจนชุดทดสอบ API จริงผ่าน เท่านั้นจึงผ่านประตู\">The implementer fills the logic until the real API suite passes — and only that closes the gate.<\u002Fdiv><\u002Fdiv>\n      <div class=\"loop-node\"><div class=\"st-no\">STEP 5<\u002Fdiv><div class=\"st-name\">CLOSE<\u002Fdiv><div class=\"st-desc\" data-en=\"The regression corpus runs and every endpoint must have ≥ 1 test. A green mock suite alone never closes a phase.\" data-th=\"ชุดถดถอยทำงาน และทุก endpoint ต้องมีเทสต์ ≥ 1 ชุด mock ที่ผ่านอย่างเดียวไม่ปิดเฟส\">ชุดประเมินงานทำงาน และทุก endpoint จะต้องมีเทสต์ ≥ 1 ชุดเสมอ การ mock อย่างเดียวไม่สามารถปิดเฟสได้<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"loop-foot reveal\">\n      <span data-en=\"Test-first is structural, not honor-system — the tests are written before any logic exists.\" data-th=\"การเขียนเทสต์ก่อนเป็นเชิงโครงสร้าง ไม่ใช่ระบบความซื่อสัตย์ — เทสต์ถูกเขียนก่อนที่ตรรกะจะมีอยู่\">การเขียนเทสต์ก่อนเป็นเชิงโครงสร้าง ไม่ใช่ระบบความซื่อสัตย์ — เทสต์ถูกเขียนก่อนที่จะเขียนโปรแกรมเสมอ<\u002Fspan>\n      <span data-en=\"Context stays small on its own — the synthesizer and the &lt;code&gt;pre-compact.sh&lt;/code&gt; hook compress and dedup state between phases.\" data-th=\"คอนเท็กซ์เล็กอยู่ได้เอง — synthesizer และ hook &lt;code&gt;pre-compact.sh&lt;/code&gt; บีบอัดและตัดข้อมูลซ้ำระหว่างเฟส\">บริบทมีขนาดเล็กอยู่เสมอ — ด้วย synthesizer และ hook pre-compact.sh บีบอัดและตัดข้อมูลซ้ำระหว่างเฟส<\u002Fspan>\n    <\u002Fdiv>\n\n    <div class=\"cmd-lead reveal\">\n      <div class=\"big\" data-en=\"Day to day, you drive with &lt;b&gt;a handful of commands&lt;/b&gt;. The bookkeeping — compaction, issue logging, decision logging — runs on its own.\" data-th=\"ในแต่ละวัน คุณขับด้วย &lt;b&gt;คำสั่งเพียงไม่กี่ตัว&lt;/b&gt; ส่วนงานจดบันทึก — การบีบคอนเท็กซ์ การบันทึกปัญหา การบันทึกการตัดสินใจ — ทำงานเอง\">ในแต่ละงาน คุณใช้งานด้วย คำสั่งเพียงไม่กี่ตัว ส่วนงานจดบันทึก — การบีบบริบท การบันทึกปัญหา การบันทึกการตัดสินใจ — ระบบจัดการให้<\u002Fdiv>\n      <div class=\"chips\"><span>/overview<\u002Fspan><span>/infra<\u002Fspan><span>/phase<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Commands you run -->\n    <div class=\"cmd-block reveal\">\n      <div class=\"cmd-grouptitle\">\n        <span class=\"gt\" data-en=\"Commands you run\" data-th=\"คำสั่งที่คุณสั่งเอง\">Commands you run<\u002Fspan>\n        <span class=\"gh\" data-en=\"The straight-line path from idea to deploy\" data-th=\"เส้นทางตรงจากไอเดียสู่การดีพลอย\">The straight-line path from idea to deploy<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"cmd-grid\">\n        <div class=\"cmd-card\">\n          <div class=\"cname\">/overview<\u002Fdiv>\n          <div class=\"cdesc\" data-en=\"Design-research, then a double grill, then &lt;code&gt;OVERVIEW.md&lt;/code&gt; and a vertical-slice &lt;code&gt;PLAN.md&lt;/code&gt;. Phase 0 (infra) is always first.\" data-th=\"วิจัยดีไซน์ แล้วซักไซ้สองรอบ จากนั้นออก &lt;code&gt;OVERVIEW.md&lt;/code&gt; และ &lt;code&gt;PLAN.md&lt;/code&gt; แบบ vertical-slice เฟส 0 (infra) มาก่อนเสมอ\">Design-research, then a double grill, then <code>OVERVIEW.md<\u002Fcode> and a vertical-slice <code>PLAN.md<\u002Fcode>. Phase 0 (infra) is always first.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cmd-card\">\n          <div class=\"cname\">/infra<\u002Fdiv>\n          <div class=\"cdesc\" data-en=\"Provision Azure: Bicep → &lt;code&gt;what-if&lt;/code&gt; diff → &lt;b&gt;your review gate&lt;/b&gt; → apply → &lt;code&gt;INFRA.md&lt;/code&gt; + &lt;code&gt;.env.test&lt;/code&gt;.\" data-th=\"จัดเตรียม Azure: Bicep → diff &lt;code&gt;what-if&lt;/code&gt; → &lt;b&gt;ประตูรีวิวของคุณ&lt;/b&gt; → apply → &lt;code&gt;INFRA.md&lt;/code&gt; + &lt;code&gt;.env.test&lt;/code&gt;\">Provision Azure: Bicep → <code>what-if<\u002Fcode> diff → <b>your review gate<\u002Fb> → apply → <code>INFRA.md<\u002Fcode> + <code>.env.test<\u002Fcode>.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cmd-card\">\n          <div class=\"cname\">/phase [n]<\u002Fdiv>\n          <div class=\"cdesc\" data-en=\"Run one phase end-to-end. It picks the TDD or direct order at research time and runs the coverage gate at CLOSE.\" data-th=\"วิ่งหนึ่งเฟสตั้งแต่ต้นจนจบ เลือกลำดับ TDD หรือแบบตรงตอนวิจัย แล้ววิ่งประตูความครอบคลุมตอน CLOSE\">Run one phase end-to-end. It picks the TDD or direct order at research time and runs the coverage gate at CLOSE.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- When you need them -->\n    <div class=\"cmd-block reveal\">\n      <div class=\"cmd-grouptitle\">\n        <span class=\"gt\" data-en=\"When you need them\" data-th=\"เมื่อจำเป็นต้องใช้\">When you need them<\u002Fspan>\n        <span class=\"gh\" data-en=\"The escape hatches the loop is built around\" data-th=\"ทางออกที่ลูปออกแบบเผื่อไว้\">The escape hatches the loop is built around<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"cmd-grid\">\n        <div class=\"cmd-card accent\">\n          <div class=\"cname\">/quick [change]<\u002Fdiv>\n          <div class=\"cdesc\" data-en=\"For a small, obvious change that doesn't deserve a phase. A direct edit with no agent chain — then the mock regression corpus runs so nothing silently breaks.\" data-th=\"สำหรับการเปลี่ยนเล็ก ๆ ชัดเจน ที่ไม่คุ้มจะตั้งเป็นเฟส แก้ตรง ๆ ไม่มีสาย agent แล้วชุดถดถอย mock จะวิ่ง เพื่อไม่ให้มีอะไรพังเงียบ ๆ\">สำหรับการเปลี่ยนเล็ก ๆ ชัดเจน ที่ไม่คุ้มจะตั้งเป็นเฟส แก้ตรง ๆ ไม่มีสาย agent แล้วชุดตรวจสอบ mock จะวิ่ง เพื่อไม่ให้มีอะไรพังเงียบ ๆ<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cmd-card accent\">\n          <div class=\"cname\">/replan [change]<\u002Fdiv>\n          <div class=\"cdesc\" data-en=\"When the plan drifts. Revises &lt;code&gt;PLAN.md&lt;/code&gt; while keeping finished phases untouched, re-runs design-research if a new service appears, and preserves the deploy block in the last pending phase.\" data-th=\"เมื่อแผนเริ่มเพี้ยน แก้ &lt;code&gt;PLAN.md&lt;/code&gt; โดยไม่แตะเฟสที่เสร็จแล้ว วิจัยดีไซน์ใหม่ถ้ามีบริการใหม่ และคงบล็อกดีพลอยในเฟสสุดท้ายที่ยังค้าง\">เมื่อแผนเริ่มเปลี่ยนไป แก้ PLAN.md โดยไม่แตะเฟสที่เสร็จแล้ว วิจัยดีไซน์ใหม่ถ้ามีบริการใหม่ และคงบล็อกดีพลอยในเฟสสุดท้ายเสมอ<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"cmd-card accent\">\n          <div class=\"cname\">/unstuck<\u002Fdiv>\n          <div class=\"cdesc\" data-en=\"Deep re-research after the circuit breaker fires. The debug cap is hard: warn at 2, &lt;b&gt;STOP at 3&lt;/b&gt; and ask you — the kit never auto-unsticks. You trigger this when you're ready.\" data-th=\"วิจัยเชิงลึกใหม่หลังตัวตัดวงจรทำงาน เพดานดีบักเข้มงวด: เตือนครั้งที่ 2 &lt;b&gt;หยุดครั้งที่ 3&lt;/b&gt; แล้วถามคุณ — ชุดนี้ไม่แก้เองอัตโนมัติ คุณเป็นคนสั่งเมื่อพร้อม\">วิจัยเชิงลึกใหม่หลังตัวตัดวงจรทำงาน(หรือคุณสั่ง) เพดานดีบัก: เตือนในครั้งที่ 2 หยุดในครั้งที่ 3 แล้วถามคุณ — มันจะไม่แก้ต่อเองอัตโนมัติ คุณเป็นคนสั่งเมื่อพร้อม<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- Runs automatically -->\n    <div class=\"cmd-block reveal\">\n      <div class=\"cmd-grouptitle\">\n        <span class=\"gt\" data-en=\"Runs automatically\" data-th=\"ทำงานเองอัตโนมัติ\">Runs automatically<\u002Fspan>\n        <span class=\"gh\" data-en=\"Hooks and the orchestrator fire these for you — you rarely type them\" data-th=\"hooks และ orchestrator สั่งให้เอง — คุณแทบไม่ต้องพิมพ์\">Hooks and the orchestrator fire these for you — you rarely type them<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"auto-grid\">\n        <div class=\"auto-card\">\n          <div class=\"ac-top\"><span class=\"cname\">/synthesize<\u002Fspan><span class=\"auto-badge\">AUTO<\u002Fspan><\u002Fdiv>\n          <div class=\"cdesc\" data-en=\"Compresses &lt;code&gt;STATE.md&lt;/code&gt;, dedups &lt;code&gt;ISSUES.md&lt;/code&gt;, and prunes snapshots — triggered around compaction so handoff files never bloat.\" data-th=\"บีบอัด &lt;code&gt;STATE.md&lt;/code&gt; ตัดซ้ำ &lt;code&gt;ISSUES.md&lt;/code&gt; และตัดสแนปช็อต — ทำงานช่วงบีบคอนเท็กซ์ ไฟล์ส่งต่อจึงไม่บวม\">Compresses <code>STATE.md<\u002Fcode>, dedups <code>ISSUES.md<\u002Fcode>, and prunes snapshots — triggered around compaction so handoff files never bloat.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"auto-card\">\n          <div class=\"ac-top\"><span class=\"cname\">/log-issue<\u002Fspan><span class=\"auto-badge\">AUTO<\u002Fspan><\u002Fdiv>\n          <div class=\"cdesc\" data-en=\"Every resolved error is appended to &lt;code&gt;ISSUES.md&lt;/code&gt; with its root cause and failed attempts — so the same dead end is never repeated.\" data-th=\"ทุกข้อผิดพลาดที่แก้แล้วถูกบันทึกใน &lt;code&gt;ISSUES.md&lt;/code&gt; พร้อมต้นเหตุและความพยายามที่ล้มเหลว — ทางตันเดิมจึงไม่เกิดซ้ำ\">Every resolved error is appended to <code>ISSUES.md<\u002Fcode> with its root cause and failed attempts — so the same dead end is never repeated.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"auto-card\">\n          <div class=\"ac-top\"><span class=\"cname\">/log-decision<\u002Fspan><span class=\"auto-badge\">AUTO<\u002Fspan><\u002Fdiv>\n          <div class=\"cdesc\" data-en=\"Any architectural change is recorded in &lt;code&gt;DESIGN_LOG.md&lt;/code&gt; before a phase closes — logging never depends on you remembering. &lt;code&gt;/store-wisdom&lt;/code&gt; promotes wisdom to the shared KB on your approval.\" data-th=\"การเปลี่ยนสถาปัตยกรรมทุกครั้งถูกบันทึกใน &lt;code&gt;DESIGN_LOG.md&lt;/code&gt; ก่อนปิดเฟส — การบันทึกไม่ขึ้นกับว่าคุณจะจำได้ไหม &lt;code&gt;/store-wisdom&lt;/code&gt; ส่งความรู้ขึ้น KB ที่แชร์เมื่อคุณอนุมัติ\">Any architectural change is recorded in <code>DESIGN_LOG.md<\u002Fcode> before a phase closes — logging never depends on you remembering. <code>/store-wisdom<\u002Fcode> promotes wisdom to the shared KB on your approval.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ───────── INSTALL ───────── -->\n<section class=\"block tint\" id=\"install\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\" style=\"margin-bottom:36px;\">\n      <span class=\"eyebrow\" data-en=\"Install\" data-th=\"ติดตั้ง\">Install<\u002Fspan>\n      <h2 data-en=\"Up and running in one command.\" data-th=\"พร้อมใช้งานด้วยคำสั่งเดียว\">Up and running in one command.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"install-band reveal\">\n      <div>\n        <p data-en=\"Run it in any project. The installer is idempotent and non-destructive — it never clobbers your files, and re-running it upgrades safely.\" data-th=\"รันในโปรเจกต์ใดก็ได้ ตัวติดตั้งทำงานซ้ำได้และไม่ทำลายไฟล์เดิม ไม่เขียนทับไฟล์ของคุณ และรันซ้ำเพื่ออัปเกรดได้อย่างปลอดภัย\" style=\"font-size:18px;color:var(--fg2);line-height:1.6;max-width:42ch;\">Run it in any project. The installer is idempotent and non-destructive — it never clobbers your files, and re-running it upgrades safely.<\u002Fp>\n        <div class=\"ib-cmd\">\n          <span class=\"prompt\">$<\u002Fspan>\n          <code id=\"install-cmd2\">npx create-anpunkit<\u002Fcode>\n          <button class=\"copy\" id=\"copyBtn2\" data-en=\"COPY\" data-th=\"คัดลอก\">COPY<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"ib-note\" data-en=\"Requires Node ≥ 18 and bash on your PATH (Git Bash on Windows).\" data-th=\"ต้องใช้ Node ≥ 18 และมี bash ใน PATH (Git Bash บน Windows)\">Requires Node ≥ 18 and bash on your PATH (Git Bash on Windows).<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ib-flags\">\n        <div class=\"ib-flag\"><span class=\"fk\">--dry-run<\u002Fspan><span class=\"fv\" data-en=\"Print the plan and write nothing.\" data-th=\"แสดงแผนโดยไม่เขียนอะไร\">Print the plan and write nothing.<\u002Fspan><\u002Fdiv>\n        <div class=\"ib-flag\"><span class=\"fk\">--kb-path ~/kb<\u002Fspan><span class=\"fv\" data-en=\"Connect a shared knowledge base you cloned first.\" data-th=\"เชื่อมฐานความรู้ที่แชร์กันซึ่งคุณ clone ไว้ก่อน\">Connect a shared knowledge base you cloned first.<\u002Fspan><\u002Fdiv>\n        <div class=\"ib-flag\"><span class=\"fk\">--no-kb<\u002Fspan><span class=\"fv\" data-en=\"Skip KB setup entirely.\" data-th=\"ข้ามการตั้งค่า KB ทั้งหมด\">Skip KB setup entirely.<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ───────── FOOTER ───────── -->\n<footer>\n  <div class=\"wrap\">\n    <div class=\"foot-top\">\n      <div class=\"foot-tag\"><span class=\"q\">“<\u002Fspan><span data-en=\"Worry-free or fail hard, nothing in between.\" data-th=\"ไร้กังวล หรือพังให้ดังไปเลย ไม่มีอะไรอยู่ตรงกลาง\">Worry-free or fail hard, nothing in between.<\u002Fspan><span class=\"q\">”<\u002Fspan><\u002Fdiv>\n      <div class=\"foot-links\">\n        <div class=\"foot-col\">\n          <h4 data-en=\"Project\" data-th=\"โปรเจกต์\">Project<\u002Fh4>\n          <a href=\"https://github.com/MetheeS/anpunkit\" target=\"_blank\" rel=\"noopener\" class=\"mono\">github.com/MetheeS/anpunkit<\u002Fa>\n          <a href=\"https://www.npmjs.com/package/create-anpunkit\" target=\"_blank\" rel=\"noopener\" class=\"mono\">npm: create-anpunkit<\u002Fa>\n          <span class=\"mono\">v2.0.2<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"foot-col\">\n          <h4 data-en=\"Requirements\" data-th=\"ความต้องการระบบ\">Requirements<\u002Fh4>\n          <span class=\"mono\">Node ≥ 18<\u002Fspan>\n          <span class=\"mono\">bash on PATH<\u002Fspan>\n          <span data-en=\"Claude Code · Cursor\" data-th=\"Claude Code · Cursor\">Claude Code · Cursor<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot-bottom\">\n      <p data-en=\"anpunkit — an engineering methodology kit for AI coding agents.\" data-th=\"anpunkit — ชุดเครื่องมือระเบียบวิธีทางวิศวกรรมสำหรับ AI coding agents\">anpunkit — an engineering methodology kit for AI coding agents.<\u002Fp>\n      <span class=\"reqs\">npx create-anpunkit<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<script>\n(function(){\n  var STORE='anpunkit-lang';\n  function pickInitial(){\n    var saved=null; try{saved=localStorage.getItem(STORE);}catch(e){}\n    if(saved==='en'||saved==='th') return saved;\n    var nav=(navigator.language||'en').toLowerCase();\n    return nav.indexOf('th')===0 ? 'th' : 'en';\n  }\n  var current=null;\n  // Persist any in-place edits made in the active language before switching away,\n  // so inline edits in the preview survive a language toggle.\n  function syncBack(){\n    if(!current) return;\n    document.querySelectorAll('[data-en]').forEach(function(el){\n      el.setAttribute('data-'+current, el.innerHTML);\n    });\n  }\n  function apply(lang){\n    if(lang===current) return;\n    syncBack();\n    document.documentElement.setAttribute('lang',lang);\n    document.querySelectorAll('[data-en]').forEach(function(el){\n      var val=el.getAttribute('data-'+lang);\n      if(val!=null) el.innerHTML=val;\n    });\n    document.querySelectorAll('.lang-toggle button').forEach(function(b){\n      b.classList.toggle('active', b.getAttribute('data-lang')===lang);\n    });\n    current=lang;\n    try{localStorage.setItem(STORE,lang);}catch(e){}\n  }\n  document.querySelectorAll('.lang-toggle button').forEach(function(b){\n    b.addEventListener('click',function(){apply(b.getAttribute('data-lang'));});\n  });\n  apply(pickInitial());\n\n  // copy install command\n  document.querySelectorAll('.copy').forEach(function(cb){\n    cb.addEventListener('click',function(){\n      var holder=cb.previousElementSibling;\n      var txt=holder?holder.textContent:'npx create-anpunkit';\n      var done=function(){\n        var lang=document.documentElement.getAttribute('lang');\n        cb.textContent = lang==='th' ? 'คัดลอกแล้ว' : 'COPIED';\n        setTimeout(function(){ cb.textContent = cb.getAttribute('data-'+lang); },1600);\n      };\n      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,done);}\n      else{done();}\n    });\n  });\n\n  // reveal on scroll\n  var io=new IntersectionObserver(function(entries){\n    entries.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} });\n  },{threshold:.12,rootMargin:'0px 0px -8% 0px'});\n  document.querySelectorAll('.reveal').forEach(function(el){io.observe(el);});\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
</body>
